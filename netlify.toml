# Netlify — versie 1.0 | Laatst gewijzigd: 2026-11-04.
# Bouwt vanuit deze projectmap; public/_redirects ondersteunt directe paginalinks.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
